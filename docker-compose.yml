services:
  portfolio:
    build: .
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_PATH: /app/data/portfolio.db
      ADMIN_TOKEN: grishisgod
    volumes:
      - portfolio_data:/app/data

volumes:
  portfolio_data: